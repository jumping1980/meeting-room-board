<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>會議室預約看板</title>
<style>
  :root {
    --board: #FBFCFD;
    --ink: #17263B;
    --ink-soft: #5B6B80;
    --rule: #DCE3EA;
    --rule-strong: #B9C4D0;
    --ground: #E8EDF2;
    --now: #D8402E;
    --danger: #B42318;
    --r1: #1F7A8C;
    --r2: #7A4E9A;
    --r3: #B7791F;
    --row: 40px;
    --head: 48px;
    --paper: #fff;          /* 輸入框底色、hover 混色基底 */
    --on-ink: #fff;         /* 主要按鈕上的文字 */
    --hover-bg: #fff;
    --primary-hover: #24395a;
    --danger-hover: #fdecea;
    --past-a: #F1F4F7;
    --past-b: #E6EBF0;
    --shadow: rgba(23,38,59,.35);
    --backdrop: rgba(23,38,59,.45);
    color-scheme: light;
  }
  /* 深色模式：只覆寫配色變數 */
  :root[data-theme="dark"] {
    --board: #172131;
    --ink: #E6EDF5;
    --ink-soft: #A3B3C7;
    --rule: #2A3748;
    --rule-strong: #4A5C73;
    --ground: #0E1521;
    --now: #FF6B57;
    --danger: #FF8A80;
    --r1: #4CC3D9;
    --r2: #BE92DC;
    --r3: #E8AC42;
    --paper: #0F1825;
    --on-ink: #0E1521;
    --hover-bg: #223048;
    --primary-hover: #C9D6E6;
    --danger-hover: #3A1E22;
    --past-a: #131C2A;
    --past-b: #1B2636;
    --shadow: rgba(0,0,0,.6);
    --backdrop: rgba(0,0,0,.65);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    line-height: 1.5;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  /* 頁首：日期即標題 */
  header { max-width: 980px; margin: 0 auto; padding: 28px 20px 16px; }
  .date-title { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: .02em; line-height: 1.2; }
  .date-title small { font-size: 16px; font-weight: 500; color: var(--ink-soft); letter-spacing: 0; }
  .date-title .yr { margin-right: 8px; }
  .date-title .wd { margin-left: 10px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  button {
    padding: 7px 14px; border: 1px solid var(--rule-strong); border-radius: 4px;
    background: var(--board); cursor: pointer; min-height: 36px;
  }
  button:hover { background: var(--hover-bg); border-color: var(--ink); }
  button.primary { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
  button.primary:hover { background: var(--primary-hover); }
  button.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  button.danger:hover { background: var(--danger-hover); }
  input, select {
    width: 100%; padding: 7px 10px; border: 1px solid var(--rule-strong);
    border-radius: 4px; background: var(--paper); min-height: 36px;
  }
  .toolbar input[type=date] { width: auto; }
  #themeToggle { margin-left: auto; }

  /* 格狀圖 */
  main { max-width: 980px; margin: 0 auto; padding: 0 20px 40px; }
  .board { background: var(--board); border: 1px solid var(--rule-strong); border-radius: 6px; overflow-x: auto; }
  .board-inner { position: relative; min-width: 560px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; table-layout: fixed; }
  th, td { padding: 0; font-size: 13px; border-bottom: 1px solid var(--rule); border-right: 1px solid var(--rule); }
  th:last-child, td:last-child { border-right: 0; }
  th {
    height: var(--head); text-align: left; padding: 0 12px; font-size: 15px; font-weight: 700;
    background: var(--board); border-bottom: 2px solid var(--ink);
    border-top: 5px solid var(--rc, var(--ink));
  }
  td { height: var(--row); }
  tr.hour td { border-top: 0; }
  tr.half td { border-bottom-style: dotted; }
  .c-r1 { --rc: var(--r1); } .c-r2 { --rc: var(--r2); } .c-r3 { --rc: var(--r3); }
  th.time, td.time {
    width: 62px; position: sticky; left: 0; z-index: 2; background: var(--board);
    text-align: right; padding: 0 10px; color: var(--ink-soft);
    font-variant-numeric: tabular-nums; vertical-align: top; padding-top: 4px;
  }
  tr.hour td.time { color: var(--ink); font-weight: 600; }
  tr.half td.time { color: transparent; user-select: none; }
  th.time { border-top-color: transparent; }

  td.free { cursor: pointer; position: relative; }
  td.free::after {
    content: "＋ 預約"; position: absolute; inset: 0; display: none; align-items: center;
    padding-left: 12px; color: var(--rc); font-weight: 600; font-size: 13px;
  }
  td.free:hover { background: color-mix(in srgb, var(--rc) 9%, var(--paper)); }
  td.free:hover::after { display: flex; }

  /* 已過去：斜紋表示不可預約 */
  td.past {
    background: repeating-linear-gradient(135deg, var(--past-a) 0 6px, var(--past-b) 6px 7px);
    cursor: not-allowed;
  }

  td.booked {
    cursor: pointer; vertical-align: top; padding: 6px 10px; overflow: hidden;
    background: color-mix(in srgb, var(--rc) 14%, var(--paper));
    border-left: 5px solid var(--rc); border-bottom-color: var(--board);
  }
  td.booked:hover { background: color-mix(in srgb, var(--rc) 22%, var(--paper)); }
  td.booked.done { opacity: .62; }
  td.booked .who { display: block; font-weight: 700; font-size: 14px; line-height: 1.3; }
  td.booked .what { display: block; color: var(--ink); font-size: 13px; line-height: 1.35; overflow-wrap: anywhere; }
  td.booked .meta { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; }

  /* 現在時間線 */
  .now-line { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--now); z-index: 3; pointer-events: none; }
  .now-line::before {
    content: attr(data-t); position: absolute; left: 0; top: -11px; padding: 0 6px;
    background: var(--now); color: #fff; font-size: 11px; line-height: 20px; border-radius: 0 3px 3px 0;
    font-variant-numeric: tabular-nums;
  }

  /* 預約列表 */
  .list-head { margin: 28px 0 10px; font-size: 18px; font-weight: 700; }
  .list-head small { font-size: 13px; font-weight: 500; color: var(--ink-soft); margin-left: 8px; }
  .list { list-style: none; margin: 0; padding: 0; background: var(--board); border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; }
  .list li { display: grid; grid-template-columns: 112px 96px 1fr auto; gap: 4px 12px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--rule); border-left: 5px solid var(--rc); cursor: pointer; }
  .list li:last-child { border-bottom: 0; }
  .list li:hover { background: color-mix(in srgb, var(--rc) 9%, var(--paper)); }
  .list li.done { opacity: .62; }
  .list .t { font-weight: 700; font-variant-numeric: tabular-nums; }
  .list .rm { color: var(--rc); font-weight: 600; }
  .list .tx b { font-weight: 700; margin-right: 8px; }
  .list .empty { display: block; cursor: default; color: var(--ink-soft); border-left-color: var(--rule-strong); }
  .list .empty:hover { background: none; }
  .list .cancel-btn { padding: 2px 12px; font-size: 13px; align-self: center; }
  @media (max-width: 600px) { .list li { grid-template-columns: 1fr; gap: 0; } .list .cancel-btn { justify-self: end; margin-top: 6px; } }

  /* 對話框 */
  dialog {
    border: 0; border-radius: 6px; padding: 0; width: min(440px, calc(100vw - 24px));
    box-shadow: 0 18px 50px var(--shadow); background: var(--board); color: var(--ink);
  }
  dialog::backdrop { background: var(--backdrop); }
  dialog[open] { animation: pop .14s ease-out; }
  @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  .dlg-head { padding: 16px 20px 12px; border-top: 6px solid var(--rc, var(--ink)); border-bottom: 1px solid var(--rule); }
  .dlg-head h2 { margin: 0; font-size: 18px; }
  .dlg-head p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; }
  .dlg-body { padding: 16px 20px 4px; }
  label { display: block; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  label input, label select { margin-top: 4px; font-weight: 400; color: var(--ink); }
  .row { display: flex; gap: 10px; }
  .row > label { flex: 1; }
  .error { color: var(--danger); font-size: 13px; font-weight: 600; min-height: 20px; margin-bottom: 8px; }
  .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 20px 18px; }
  .actions .left { margin-right: auto; }
  [hidden] { display: none !important; }

  @media (max-width: 600px) {
    header { padding: 18px 12px 12px; }
    main { padding: 0 8px 28px; }
    .date-title { font-size: 26px; }
    th.time, td.time { width: 52px; padding: 4px 6px 0 0; }
  }
  @media (prefers-reduced-motion: reduce) { dialog[open] { animation: none; } }
</style>
</head>
<body>
<header>
  <h1 class="date-title" id="dateTitle"></h1>
  <div class="toolbar">
    <button id="prevDay" type="button">前一天</button>
    <button id="today" type="button">今天</button>
    <button id="nextDay" type="button">後一天</button>
    <input type="date" id="datePick" aria-label="選擇日期">
    <button id="exportCsv" type="button">匯出 CSV</button>
    <button id="themeToggle" type="button" aria-pressed="false">🌙 深色模式</button>
  </div>
</header>
<main>
  <div class="board"><div class="board-inner" id="inner"><table id="grid"></table></div></div>
  <h2 class="list-head" id="listHead"></h2>
  <ul class="list" id="list"></ul>
</main>

<dialog id="dlg">
  <form id="form" method="dialog" novalidate>
    <div class="dlg-head">
      <h2 id="dlgTitle"></h2>
      <p id="dlgSub"></p>
    </div>
    <div class="dlg-body">
      <label>姓名 <input id="fName" maxlength="30" autocomplete="off"></label>
      <label>會議主題 <input id="fTopic" maxlength="60" autocomplete="off"></label>
      <label>會議室 <select id="fRoom"></select></label>
      <div class="row">
        <label>開始 <select id="fStart"></select></label>
        <label>結束 <select id="fEnd"></select></label>
      </div>
      <div class="error" id="err" role="alert"></div>
    </div>
    <div class="actions">
      <button type="button" class="danger left" id="btnDel">取消預約</button>
      <button type="button" id="btnClose">關閉</button>
      <button type="submit" class="primary" id="btnSave">儲存預約</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
<script>
// ===== 設定常數 =====
const CONFIG = {
  OPEN_HOUR: 9,          // 營業開始（時）
  CLOSE_HOUR: 18,        // 營業結束（時）
  SLOT_MINUTES: 30,      // 每格分鐘數
  STORAGE_KEY: 'meetingRoomBookings.v1',
  ROOMS: [
    { id: 'r1', name: '會議室 A' },
    { id: 'r2', name: '會議室 B' },
    { id: 'r3', name: '會議室 C' },
  ],
};

// ===== 資料層：唯一接觸 localStorage 的地方，日後可替換為後端 =====
const bookingStore = (() => {
  function readAll() {
    try {
      const data = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY));
      return Array.isArray(data) ? data : [];
    } catch (e) { return []; }
  }
  function writeAll(list) {
    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(list));
  }
  return {
    list(date) { return readAll().filter(b => b.date === date); },
    get(id) { return readAll().find(b => b.id === id) || null; },
    create(b) {
      const all = readAll();
      const rec = { ...b, id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) };
      all.push(rec); writeAll(all); return rec;
    },
    update(id, b) {
      const all = readAll();
      const i = all.findIndex(x => x.id === id);
      if (i < 0) return null;
      all[i] = { ...b, id }; writeAll(all); return all[i];
    },
    remove(id) { writeAll(readAll().filter(b => b.id !== id)); },
  };
})();

// ===== 領域邏輯 =====
const SLOT_COUNT = (CONFIG.CLOSE_HOUR - CONFIG.OPEN_HOUR) * 60 / CONFIG.SLOT_MINUTES;
const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

// 格索引 → "HH:mm"（索引可到 SLOT_COUNT，代表結束時間）
function slotLabel(i) {
  const m = CONFIG.OPEN_HOUR * 60 + i * CONFIG.SLOT_MINUTES;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function fmtDate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
// 該格起始時間已早於現在即視為過去
function isPast(date, slot) {
  const d = parseDate(date);
  d.setMinutes(CONFIG.OPEN_HOUR * 60 + slot * CONFIG.SLOT_MINUTES);
  return d < new Date();
}
// 衝突檢查 findConflict 已移至 app.js
function validate(f) {
  if (!f.name.trim()) return '請填寫姓名';
  if (!f.topic.trim()) return '請填寫會議主題';
  if (!f.room) return '請選擇會議室';
  if (!Number.isInteger(f.start) || !Number.isInteger(f.end) || f.end <= f.start) return '結束時間必須晚於開始時間';
  return '';
}
const roomName = id => CONFIG.ROOMS.find(r => r.id === id).name;
const roomClass = id => 'c-' + id;

// ===== UI =====
const $ = id => document.getElementById(id);
let curDate = fmtDate(new Date());
let editingId = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function render() {
  const d = parseDate(curDate);
  $('dateTitle').innerHTML = `<small class="yr">${d.getFullYear()}年</small>${d.getMonth() + 1}月${d.getDate()}日<small class="wd">週${WEEKDAYS[d.getDay()]}</small>`;
  $('datePick').value = curDate;

  const bookings = bookingStore.list(curDate);
  let html = '<thead><tr><th class="time"></th>' +
    CONFIG.ROOMS.map(r => `<th class="${roomClass(r.id)}">${r.name}</th>`).join('') + '</tr></thead><tbody>';
  const skip = {}; // 已被 rowspan 佔用的格
  for (let s = 0; s < SLOT_COUNT; s++) {
    const isHour = (s * CONFIG.SLOT_MINUTES) % 60 === 0;
    html += `<tr class="${isHour ? 'hour' : 'half'}"><td class="time">${slotLabel(s)}</td>`;
    for (const r of CONFIG.ROOMS) {
      if (skip[r.id + s]) continue;
      const b = bookings.find(x => x.room === r.id && x.start === s);
      if (b) {
        const span = b.end - b.start;
        for (let k = 1; k < span; k++) skip[r.id + (s + k)] = true;
        const done = isPast(curDate, b.end - 1) ? ' done' : '';
        html += `<td class="booked ${roomClass(r.id)}${done}" rowspan="${span}" data-id="${b.id}" tabindex="0">` +
          `<span class="who">${esc(b.name)}</span><span class="what">${esc(b.topic)}</span>` +
          `<span class="meta">${slotLabel(b.start)}–${slotLabel(b.end)}</span></td>`;
      } else if (isPast(curDate, s)) {
        html += '<td class="past"></td>';
      } else {
        html += `<td class="free ${roomClass(r.id)}" data-room="${r.id}" data-slot="${s}" tabindex="0" aria-label="${r.name} ${slotLabel(s)} 空檔，點擊預約"></td>`;
      }
    }
    html += '</tr>';
  }
  $('grid').innerHTML = html + '</tbody>';
  renderNowLine();
  renderList(bookings);
}

// 當日預約列表：依開始時間排序，點選可檢視／編輯
function renderList(bookings) {
  $('listHead').innerHTML = `當日預約<small>${bookings.length} 筆</small>`;
  if (!bookings.length) {
    $('list').innerHTML = '<li class="empty">這天還沒有預約。點上方格狀圖的空格即可新增。</li>';
    return;
  }
  const sorted = [...bookings].sort((a, b) => a.start - b.start || a.room.localeCompare(b.room));
  $('list').innerHTML = sorted.map(b => {
    const done = isPast(curDate, b.end - 1) ? ' done' : '';
    // 已開始的預約不可取消，不顯示按鈕
    const cancelBtn = isPast(b.date, b.start) ? '' :
      `<button type="button" class="danger cancel-btn" data-cancel="${b.id}">取消</button>`;
    return `<li class="${roomClass(b.room)}${done}" data-id="${b.id}" tabindex="0">` +
      `<span class="t">${slotLabel(b.start)}–${slotLabel(b.end)}</span><span class="rm">${roomName(b.room)}</span>` +
      `<span class="tx"><b>${esc(b.name)}</b>${esc(b.topic)}</span>${cancelBtn}</li>`;
  }).join('');
}

// 現在時間線：僅在今天且位於營業時段內顯示
function renderNowLine() {
  const old = $('inner').querySelector('.now-line');
  if (old) old.remove();
  if (curDate !== fmtDate(new Date())) return;
  const n = new Date();
  const mins = n.getHours() * 60 + n.getMinutes() - CONFIG.OPEN_HOUR * 60;
  if (mins < 0 || mins > SLOT_COUNT * CONFIG.SLOT_MINUTES) return;
  const css = getComputedStyle(document.documentElement);
  const row = parseFloat(css.getPropertyValue('--row'));
  const head = parseFloat(css.getPropertyValue('--head'));
  const line = document.createElement('div');
  line.className = 'now-line';
  line.dataset.t = String(n.getHours()).padStart(2, '0') + ':' + String(n.getMinutes()).padStart(2, '0');
  line.style.top = (head + 5 + mins / CONFIG.SLOT_MINUTES * row) + 'px';
  $('inner').appendChild(line);
}

function fillEnd(start, selected) {
  let o = '';
  for (let e = start + 1; e <= SLOT_COUNT; e++) o += `<option value="${e}">${slotLabel(e)}</option>`;
  $('fEnd').innerHTML = o;
  $('fEnd').value = (selected > start && selected <= SLOT_COUNT) ? selected : start + 1;
}

function openDialog(b, room, slot) {
  editingId = b ? b.id : null;
  const readonly = b ? isPast(b.date, b.start) : false; // 已開始的預約僅檢視
  const roomId = b ? b.room : room;
  $('dlg').className = roomClass(roomId);
  $('dlgTitle').textContent = b ? (readonly ? '預約內容' : '編輯預約') : '新增預約';
  $('dlgSub').textContent = readonly ? '此時段已開始，無法修改或取消' : `${curDate.replace(/-/g, '/')}`;
  $('fName').value = b ? b.name : '';
  $('fTopic').value = b ? b.topic : '';
  $('fRoom').innerHTML = CONFIG.ROOMS.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
  $('fRoom').value = roomId;
  let sOpt = '';
  for (let s = 0; s < SLOT_COUNT; s++) {
    if (!isPast(curDate, s) || (b && s === b.start)) sOpt += `<option value="${s}">${slotLabel(s)}</option>`;
  }
  $('fStart').innerHTML = sOpt;
  const st = b ? b.start : slot;
  $('fStart').value = st;
  fillEnd(st, b ? b.end : st + 1);
  $('err').textContent = '';
  for (const id of ['fName', 'fTopic', 'fRoom', 'fStart', 'fEnd']) $(id).disabled = readonly;
  $('btnDel').hidden = !b || readonly;
  $('btnSave').hidden = readonly;
  $('btnSave').textContent = b ? '儲存變更' : '儲存預約';
  $('dlg').showModal();
}

function activate(td) {
  if (!td) return;
  if (td.classList.contains('free')) openDialog(null, td.dataset.room, Number(td.dataset.slot));
  else if (td.classList.contains('booked')) openDialog(bookingStore.get(td.dataset.id));
}
$('grid').addEventListener('click', e => activate(e.target.closest('td')));
$('grid').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(e.target.closest('td')); }
});
// 確認後取消預約；列表與對話框共用
function cancelBooking(id) {
  if (!confirm('確定要取消這筆預約嗎？取消後該時段會恢復為空檔。')) return false;
  bookingStore.remove(id);
  render();
  return true;
}
// 匯出目前日期的預約為 CSV（會議室、時段、預約人）
function csvCell(v) {
  let s = String(v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // 避免試算表將內容當公式執行
  return '"' + s.replace(/"/g, '""') + '"';
}
$('exportCsv').addEventListener('click', () => {
  const sorted = [...bookingStore.list(curDate)].sort((a, b) => a.start - b.start || a.room.localeCompare(b.room));
  const rows = [['會議室', '時段', '預約人'], ...sorted.map(b =>
    [roomName(b.room), slotLabel(b.start) + '–' + slotLabel(b.end), b.name])];
  const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'); // BOM 讓 Excel 正確顯示中文
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `預約清單-${curDate}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
});
$('list').addEventListener('click', e => {
  const cb = e.target.closest('[data-cancel]');
  if (cb) { cancelBooking(cb.dataset.cancel); return; }
  const li = e.target.closest('li[data-id]');
  if (li) openDialog(bookingStore.get(li.dataset.id));
});
$('list').addEventListener('keydown', e => {
  if (e.target.closest('[data-cancel]')) return; // 按鈕自身的 Enter／Space 只觸發取消
  const li = e.target.closest('li[data-id]');
  if (li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDialog(bookingStore.get(li.dataset.id)); }
});
$('fStart').addEventListener('change', () => {
  fillEnd(Number($('fStart').value), Number($('fEnd').value));
});
$('btnClose').addEventListener('click', () => $('dlg').close());
$('btnDel').addEventListener('click', () => {
  if (cancelBooking(editingId)) $('dlg').close();
});
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const f = {
    name: $('fName').value, topic: $('fTopic').value,
    room: $('fRoom').value, start: parseInt($('fStart').value, 10), end: parseInt($('fEnd').value, 10),
  };
  const msg = validate(f);
  if (msg) { $('err').textContent = msg; return; }
  const rec = { date: curDate, room: f.room, start: f.start, end: f.end,
    name: f.name.trim(), topic: f.topic.trim() };
  // 過去時段不可新增或修改；編輯時若起始格未變，仍視為合法
  const orig = editingId ? bookingStore.get(editingId) : null;
  if (isPast(curDate, rec.start) && !(orig && orig.start === rec.start)) {
    $('err').textContent = '這個時段已經開始，無法預約'; return;
  }
  const c = findConflict(rec, editingId);
  if (c) {
    $('err').textContent = `${roomName(c.room)} ${slotLabel(c.start)}–${slotLabel(c.end)} 已被 ${c.name} 預約，請改選其他時段或會議室`;
    return; // 不寫入，原預約保持不變
  }
  if (editingId) bookingStore.update(editingId, rec); else bookingStore.create(rec);
  $('dlg').close(); render();
});

function shiftDay(n) {
  const d = parseDate(curDate); d.setDate(d.getDate() + n);
  curDate = fmtDate(d); render();
}
$('prevDay').onclick = () => shiftDay(-1);
$('nextDay').onclick = () => shiftDay(1);
$('today').onclick = () => { curDate = fmtDate(new Date()); render(); };
$('datePick').onchange = e => { if (e.target.value) { curDate = e.target.value; render(); } };

render();
// 每分鐘更新過去時段與現在時間線（對話框開啟時不重繪格狀圖，以免打斷輸入）
setInterval(() => { if (!$('dlg').open) render(); }, 60000);
</script>
<script>
// 深色模式切換：僅切換 <html> 的 data-theme，不涉及預約資料
$('themeToggle').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme !== 'dark';
  if (dark) document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;
  $('themeToggle').setAttribute('aria-pressed', String(dark));
  $('themeToggle').textContent = dark ? '☀️ 淺色模式' : '🌙 深色模式';
});
</script>
